<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soal MTK for Qisya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff6e6; --cream-2:#fde9d0; --pink:#ffdce7; --pink-2:#ffc2d6; --rose:#e27a9b; --rose-deep:#b94e73;
  --ink:#5a3848; --ink-soft:#8c6878; --line:rgba(226,122,155,.28);
  --bg-1:#fff6e6; --bg-2:#ffe9ee; --bg-3:#ffd9e6;
  --card:rgba(255,255,255,.66); --card-solid:#fffaf3; --shadow:rgba(185,78,115,.18);
  --a-bg:#ffd6e1; --a-bd:#f3a3bd; --b-bg:#ffe5c6; --b-bd:#f2be86; --c-bg:#e6dbff; --c-bd:#bfa6f0;
  --ok-bg:#d4f2df; --ok-bd:#72c592; --ok-ink:#25693f;
  --no-bg:#ffd8d8; --no-bd:#e98a8a; --no-ink:#8f2f2f;
  --blob-1:#ffc9da; --blob-2:#ffe2b8; --blob-3:#f7d4ff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ffe7ef; --ink-soft:#d1aebd; --line:rgba(255,170,200,.25);
    --bg-1:#2b1c26; --bg-2:#3a2232; --bg-3:#4a2a3e;
    --card:rgba(255,255,255,.08); --card-solid:#3a2534; --shadow:rgba(0,0,0,.4);
    --a-bg:#5a2c40; --a-bd:#a65a7a; --b-bg:#5a4128; --b-bd:#a67a45; --c-bg:#3f3462; --c-bd:#7c68b8;
    --ok-bg:#25503a; --ok-bd:#4ea373; --ok-ink:#c8f3d8;
    --no-bg:#5a2a2e; --no-bd:#b35a60; --no-ink:#ffd4d6;
    --blob-1:#7a3a58; --blob-2:#6d5232; --blob-3:#54397a;
  }
}
:root[data-theme="dark"]{
  --ink:#ffe7ef; --ink-soft:#d1aebd; --line:rgba(255,170,200,.25);
  --bg-1:#2b1c26; --bg-2:#3a2232; --bg-3:#4a2a3e;
  --card:rgba(255,255,255,.08); --card-solid:#3a2534; --shadow:rgba(0,0,0,.4);
  --a-bg:#5a2c40; --a-bd:#a65a7a; --b-bg:#5a4128; --b-bd:#a67a45; --c-bg:#3f3462; --c-bd:#7c68b8;
  --ok-bg:#25503a; --ok-bd:#4ea373; --ok-ink:#c8f3d8;
  --no-bg:#5a2a2e; --no-bd:#b35a60; --no-ink:#ffd4d6;
  --blob-1:#7a3a58; --blob-2:#6d5232; --blob-3:#54397a;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0; min-height:100%; display:flex; flex-direction:column; position:relative; overflow-x:hidden;
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; color:var(--ink);
  background:var(--bg-1);
  background-image:linear-gradient(140deg,var(--bg-1) 0%,var(--bg-2) 55%,var(--bg-3) 100%);
  background-attachment:fixed;
}

/* ---------- decorative background ---------- */
.bg{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
.blob{position:absolute; border-radius:50%; filter:blur(60px); opacity:.65; animation:drift 22s ease-in-out infinite alternate;}
.blob.b1{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:radial-gradient(circle at 35% 35%,var(--blob-1),transparent 68%);}
.blob.b2{width:40vmax;height:40vmax;right:-12vmax;top:22vh;background:radial-gradient(circle at 50% 50%,var(--blob-2),transparent 66%);animation-duration:28s;}
.blob.b3{width:44vmax;height:44vmax;left:18vw;bottom:-22vmax;background:radial-gradient(circle at 50% 50%,var(--blob-3),transparent 66%);animation-duration:25s;}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(4vmax,3vmax) scale(1.08)}}
.spark{position:absolute; color:var(--rose); opacity:.0; animation:twinkle 5s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6) rotate(0)}50%{opacity:.7;transform:scale(1.1) rotate(20deg)}}
.sym{position:absolute; font-family:'Fraunces',Georgia,serif; color:var(--rose); opacity:.16; animation:floaty 14s ease-in-out infinite alternate;}
@keyframes floaty{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-22px) rotate(8deg)}}

/* ---------- layout ---------- */
main{position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 16px 12px;}
.screen{display:none; width:100%;}
.screen.active{display:block;}
footer{position:relative; z-index:1; text-align:center; padding:18px 16px 22px; line-height:1.5;}
footer .by{font-family:'Fraunces',Georgia,serif; font-style:italic; font-size:.95rem; letter-spacing:.14em; color:var(--rose-deep);}
footer .cheer{font-size:.78rem; letter-spacing:.12em; color:var(--ink-soft); font-weight:700; margin-top:2px;}
.theme-btn{
  position:fixed; z-index:5; top:calc(12px + env(safe-area-inset-top,0px)); right:14px; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:1.05rem; cursor:pointer;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:transform .2s;
}
.theme-btn:hover{transform:rotate(18deg) scale(1.08);}
button{font-family:inherit; color:inherit;}
button:focus-visible{outline:3px solid var(--rose); outline-offset:3px;}

/* ---------- menu ---------- */
.menu-wrap{max-width:400px; margin:0 auto; text-align:center; animation:rise .8s cubic-bezier(.2,.8,.2,1) both;}
@keyframes rise{from{opacity:0; transform:translateY(18px)}to{opacity:1; transform:none}}
.menu-card{
  background:var(--card); border:1px solid var(--line); border-radius:38px 38px 38px 12px; padding:34px 26px 30px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 24px 60px -18px var(--shadow), inset 0 1px 0 rgba(255,255,255,.7);
}
.crest{font-size:1.5rem; color:var(--rose); letter-spacing:.35em; margin-bottom:6px;}
.title{
  font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:1.02rem; letter-spacing:.3em; margin:0 0 6px; color:var(--rose-deep);
  padding-left:.3em;
}
.tag{font-size:.86rem; color:var(--ink-soft); margin:0 0 26px;}
.type-list{display:flex; flex-direction:column; gap:14px; align-items:center;}
.type-btn{
  position:relative; overflow:hidden; width:min(270px,100%); border:1.5px solid rgba(255,255,255,.75); cursor:pointer;
  padding:15px 22px; border-radius:999px; font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:1.05rem; letter-spacing:.2em;
  color:var(--ink); box-shadow:0 10px 24px -10px var(--shadow);
  transition:transform .28s cubic-bezier(.2,.9,.3,1.3), box-shadow .28s, letter-spacing .28s;
}
.type-btn[data-type="A"]{background:linear-gradient(120deg,#ffe0ea,#ffc7da);}
.type-btn[data-type="B"]{background:linear-gradient(120deg,#ffeacc,#ffd3b2);}
.type-btn[data-type="C"]{background:linear-gradient(120deg,#eadfff,#ffd0e6);}
.type-btn::after{
  content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent); transform:skewX(-20deg); transition:left .6s;
}
.type-btn:hover,.type-btn:focus-visible{transform:translateY(-5px) scale(1.04); letter-spacing:.28em; box-shadow:0 18px 32px -10px var(--shadow), 0 0 0 5px rgba(255,194,214,.45);}
.type-btn:hover::after,.type-btn:focus-visible::after{left:130%;}
.type-btn:active{transform:translateY(-1px) scale(.99);}
.hint{margin:24px 0 0; font-size:.78rem; color:var(--ink-soft);}

/* ---------- quiz ---------- */
.quiz-wrap{max-width:720px; margin:0 auto; animation:rise .5s cubic-bezier(.2,.8,.2,1) both;}
.topbar{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px; font-weight:800; font-size:.82rem;
  background:var(--card); border:1px solid var(--line); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.pill.exit{cursor:pointer; margin-right:auto;}
.pill.exit:hover{background:var(--pink);}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok-bd);}
.progress{height:11px; border-radius:99px; background:rgba(226,122,155,.18); overflow:hidden; margin-bottom:16px; border:1px solid var(--line);}
.progress>i{display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#ffb3cb,#f08cae,#ffcf9e); transition:width .5s cubic-bezier(.3,.8,.3,1);}
.qcard{
  background:var(--card); border:1px solid var(--line); border-radius:30px 30px 30px 10px; padding:24px 22px 22px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 22px 50px -20px var(--shadow), inset 0 1px 0 rgba(255,255,255,.7);
}
.qcard.swap{animation:swap .45s cubic-bezier(.2,.8,.2,1) both;}
@keyframes swap{from{opacity:0; transform:translateX(26px)}to{opacity:1; transform:none}}
.qhead{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.qnum{font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:.95rem; color:var(--rose-deep); }
.chip{font-size:.74rem; font-weight:800; padding:4px 11px; border-radius:99px; background:var(--pink); color:var(--rose-deep);}
.qtext{font-size:1.16rem; line-height:1.65; font-weight:600; margin:0 0 20px;}
.opts{display:grid; gap:11px;}
.opt{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer; padding:13px 16px; border-radius:20px;
  border:2px solid transparent; font-size:1.06rem; font-weight:700; color:var(--ink);
  transition:transform .18s, box-shadow .18s, background .2s, border-color .2s, opacity .25s;
}
.opt:nth-child(1){background:var(--a-bg); border-color:var(--a-bd);}
.opt:nth-child(2){background:var(--b-bg); border-color:var(--b-bd);}
.opt:nth-child(3){background:var(--c-bg); border-color:var(--c-bd);}
.opt:not(:disabled):hover{transform:translateY(-3px); box-shadow:0 12px 22px -12px var(--shadow);}
.opt .badge{
  flex:none; width:36px; height:36px; border-radius:12px; display:grid; place-items:center;
  font-family:'Fraunces',Georgia,serif; font-weight:700; background:rgba(255,255,255,.75); color:var(--rose-deep);
}
.opt .txt{flex:1;}
.opt .mark{font-size:1.2rem;}
.opt:disabled{cursor:default;}
.opt.correct{background:var(--ok-bg); border-color:var(--ok-bd); color:var(--ok-ink); animation:pop .4s ease;}
.opt.wrong{background:var(--no-bg); border-color:var(--no-bd); color:var(--no-ink); animation:shake .4s ease;}
.opt.dim{opacity:.5;}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.feedback{margin-top:18px; display:none;}
.feedback.show{display:block; animation:rise .4s ease both;}
.verdict{font-weight:800; font-size:1.02rem; margin-bottom:10px;}
.verdict.good{color:var(--ok-ink);} .verdict.bad{color:var(--no-ink);}
.solution{
  background:rgba(255,255,255,.55); border:1.5px dashed var(--line); border-radius:20px 20px 20px 6px; padding:16px 18px;
}
.solution h4{margin:0 0 8px; font-family:'Fraunces',Georgia,serif; font-size:1rem; color:var(--rose-deep);}
.steps{margin:0; padding-left:1.25em; line-height:1.7; font-size:.96rem;}
.steps li{margin-bottom:6px;}
.steps li::marker{color:var(--rose); font-weight:800;}
.answer-line{margin-top:10px; padding:9px 14px; border-radius:14px; background:var(--pink); font-weight:800; display:inline-block;}
.next{
  margin-top:16px; width:100%; border:none; cursor:pointer; padding:14px; border-radius:18px; font-weight:800; font-size:1rem; letter-spacing:.04em;
  background:linear-gradient(120deg,#f59bb9,#f4b27f); color:#fff; box-shadow:0 12px 22px -10px var(--shadow); transition:transform .2s, box-shadow .2s;
  text-shadow:0 1px 2px rgba(120,40,70,.35);
}
.next:hover{transform:translateY(-2px); box-shadow:0 16px 26px -10px var(--shadow);}
sup{font-size:.7em; line-height:0;} sub{font-size:.7em; line-height:0;}
.fr{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.15; margin:0 .18em; font-size:.92em;}
.fr>span:first-child{border-bottom:1.5px solid currentColor; padding:0 .25em;}
.fr>span:last-child{padding:0 .25em;}

/* ---------- result ---------- */
.result-wrap{max-width:720px; margin:0 auto; animation:rise .6s cubic-bezier(.2,.8,.2,1) both;}
.rcard{
  text-align:center; background:var(--card); border:1px solid var(--line); border-radius:38px 38px 12px 38px; padding:30px 22px 26px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 24px 60px -20px var(--shadow), inset 0 1px 0 rgba(255,255,255,.7);
}
.ring{position:relative; width:170px; height:170px; margin:0 auto 10px;}
.ring svg{transform:rotate(-90deg);}
.ring .val{position:absolute; inset:0; display:grid; place-items:center; font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:2.6rem; color:var(--rose-deep);}
.ring .val small{display:block; font-size:.75rem; font-family:'Nunito',sans-serif; color:var(--ink-soft); font-weight:700; margin-top:-6px;}
.rmsg{font-family:'Fraunces',Georgia,serif; font-size:1.25rem; font-weight:700; margin:6px 0 4px;}
.rsub{color:var(--ink-soft); font-size:.92rem; margin:0 0 18px;}
.rbtns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.rbtn{border:1.5px solid var(--line); background:var(--card-solid); padding:11px 18px; border-radius:99px; font-weight:800; cursor:pointer; transition:transform .2s, background .2s;}
.rbtn:hover{transform:translateY(-3px); background:var(--pink);}
.rbtn.main{background:linear-gradient(120deg,#f59bb9,#f4b27f); color:#fff; border-color:transparent; text-shadow:0 1px 2px rgba(120,40,70,.35);}
.review{margin-top:20px; display:grid; gap:10px;}
.review h3{font-family:'Fraunces',Georgia,serif; margin:8px 4px 0; color:var(--rose-deep); font-size:1.1rem;}
.ritem{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:2px 16px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
.ritem summary{cursor:pointer; list-style:none; padding:13px 0; display:flex; gap:10px; align-items:center; font-weight:700;}
.ritem summary::-webkit-details-marker{display:none;}
.ritem .n{flex:none; width:32px; height:32px; border-radius:11px; display:grid; place-items:center; font-weight:800; font-size:.86rem;}
.ritem .n.ok{background:var(--ok-bg); color:var(--ok-ink);} .ritem .n.no{background:var(--no-bg); color:var(--no-ink);}
.ritem .sm{flex:1; font-size:.92rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.ritem .body{padding:0 0 14px;}
.ritem .qfull{font-weight:600; line-height:1.6; margin:0 0 10px;}
.ritem .yours{font-size:.9rem; margin-bottom:10px; color:var(--ink-soft);}
.ritem .yours b{color:var(--ink);}
@media (max-width:480px){
  .qtext{font-size:1.06rem;} .qcard{padding:20px 16px;} .menu-card{padding:30px 20px 26px;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important;}
}
</style>
</head>
<body>

<div class="bg" id="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>
<button class="theme-btn" id="themeBtn" aria-label="Ganti tema terang atau gelap" title="Ganti tema">☾</button>

<main>
  <!-- MENU -->
  <section class="screen active" id="menu">
    <div class="menu-wrap">
      <div class="menu-card">
        <div class="crest" aria-hidden="true">✦ ✧ ✦</div>
        <h1 class="title">SOAL MTK FOR QISYA</h1>
        <p class="tag">Pilih paket soal. Tiap paket berisi 30 soal.</p>
        <div class="type-list">
          <button class="type-btn" data-type="A">TYPE A</button>
          <button class="type-btn" data-type="B">TYPE B</button>
          <button class="type-btn" data-type="C">TYPE C</button>
        </div>
        <p class="hint">Jawab satu per satu. Pembahasan muncul setelah kamu menjawab.</p>
      </div>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="quiz">
    <div class="quiz-wrap">
      <div class="topbar">
        <button class="pill exit" id="exitBtn">‹ Menu</button>
        <span class="pill" id="typePill">Type A</span>
        <span class="pill"><span class="dot"></span><span id="okCount">0</span> benar</span>
        <span class="pill" id="timer">00:00</span>
      </div>
      <div class="progress"><i id="bar"></i></div>
      <article class="qcard" id="qcard">
        <div class="qhead">
          <span class="qnum" id="qnum">Soal 1 dari 30</span>
          <span class="chip" id="qtopic">Bilangan</span>
        </div>
        <p class="qtext" id="qtext"></p>
        <div class="opts" id="opts"></div>
        <div class="feedback" id="feedback">
          <div class="verdict" id="verdict"></div>
          <div class="solution">
            <h4>Cara mengerjakan</h4>
            <ol class="steps" id="steps"></ol>
            <div class="answer-line" id="ansLine"></div>
          </div>
          <button class="next" id="nextBtn">Soal berikutnya</button>
        </div>
      </article>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="result">
    <div class="result-wrap">
      <div class="rcard">
        <div class="ring">
          <svg width="170" height="170" viewBox="0 0 130 130" aria-hidden="true">
            <circle cx="65" cy="65" r="54" fill="none" stroke="rgba(226,122,155,.2)" stroke-width="12"></circle>
            <circle id="ringFill" cx="65" cy="65" r="54" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3" style="transition:stroke-dashoffset 1.2s cubic-bezier(.3,.8,.3,1)"></circle>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59bb9"/><stop offset="1" stop-color="#f4b27f"/></linearGradient></defs>
          </svg>
          <div class="val"><div><span id="rScore">0</span><small>dari 100</small></div></div>
        </div>
        <div class="rmsg" id="rMsg"></div>
        <p class="rsub" id="rSub"></p>
        <div class="rbtns">
          <button class="rbtn main" id="againBtn">Ulangi paket ini</button>
          <button class="rbtn" id="menuBtn">Kembali ke menu</button>
        </div>
      </div>
      <div class="review" id="review"></div>
    </div>
  </section>
</main>

<footer>
  <div class="by">BY ALKEN</div>
  <div class="cheer">SEMANGAT OIT JAN LULA MAKAN</div>
</footer>

<script>
/* ============ helpers ============ */
const f = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const mk = (topic, q, correct, wrong, steps) => ({ topic, q, correct, wrong, steps });
const mod = (n) => `(tanda ≡ artinya "sisa pembagiannya sama" saat dibagi ${n})`;

/* ============ TYPE A ============ */
const SET_A = [
mk('Bilangan', `Sisa pembagian 3<sup>2026</sup> oleh 7 adalah ....`, '4', ['2','6'], [
  `Cari pola sisa pangkat 3 terhadap 7 ${mod(7)}: 3<sup>1</sup> ≡ 3, 3<sup>2</sup> = 9 ≡ 2, 3<sup>3</sup> ≡ 6, 3<sup>4</sup> = 81 ≡ 4, 3<sup>5</sup> = 243 ≡ 5, 3<sup>6</sup> = 729 ≡ 1.`,
  `Sisa kembali menjadi 1 pada pangkat 6, sehingga polanya berulang setiap 6 pangkat.`,
  `2026 = 6 × 337 + 4, maka 3<sup>2026</sup> = (3<sup>6</sup>)<sup>337</sup> · 3<sup>4</sup> ≡ 1<sup>337</sup> · 3<sup>4</sup> = 3<sup>4</sup>.`,
  `3<sup>4</sup> = 81 = 7 × 11 + 4, jadi sisanya 4.`
]),
mk('Bilangan', `Bilangan asli terkecil yang jika dibagi 4, 5, dan 6 bersisa 3, serta habis dibagi 7 adalah ....`, '63', ['123','183'], [
  `Sisa ketiganya sama (3), maka N − 3 habis dibagi 4, 5, dan 6. Artinya N − 3 kelipatan KPK(4, 5, 6) = 60.`,
  `Jadi N = 60k + 3 dengan k = 0, 1, 2, ...`,
  `N harus habis dibagi 7. Karena 60 = 7 × 8 + 4, maka 60k + 3 ≡ 4k + 3 (mod 7). Syaratnya 4k + 3 ≡ 0, yaitu 4k ≡ 4, sehingga k ≡ 1 (mod 7).`,
  `k = 0 memberi N = 3 (tidak habis dibagi 7). k terkecil yang cocok adalah k = 1, sehingga N = 60 + 3 = 63.`,
  `Cek: 63 = 7 × 9; 63 = 4 × 15 + 3; 63 = 5 × 12 + 3; 63 = 6 × 10 + 3.`
]),
mk('Bilangan', `Banyak faktor positif dari 10.800 yang merupakan bilangan kuadrat sempurna adalah ....`, '12', ['8','24'], [

mk('Bilangan', `Pada sistem bilangan basis b berlaku (124)<sub>b</sub> + (35)<sub>b</sub> = (203)<sub>b</sub>. Nilai b adalah ....`, '6', ['7','8'], [

mk('Aljabar', `Diberikan barisan 4, 10, 18, 28, 40, .... Suku ke-30 barisan tersebut adalah ....`, '990', ['960','1.020'], [

mk('Aljabar', `Harga 3 buku dan 2 pensil adalah Rp19.000, sedangkan harga 2 buku dan 5 pensil adalah Rp20.000. Harga 4 buku dan 3 pensil adalah ....`, 'Rp26.000', ['Rp24.000','Rp28.000'], [

const SETS = { A: SET_A, B: SET_B, C: SET_C };
const TOFF = { A: 0, B: 1, C: 2 };
const LET = ['A', 'B', 'C'];

/* Build options with the correct answer placed at a varied position (A, B, or C only) */
function prepare(type) {
  return SETS[type].map((q, i) => {
    const pos = (i % 3 + TOFF[type] + Math.floor(i / 3)) % 3;
    const opts = []; let w = 0;
    for (let p = 0; p < 3; p++) opts[p] = (p === pos) ? q.correct : q.wrong[w++];
    return { ...q, opts, ans: pos };
  });
}

/* ============ state + DOM ============ */
const $ = (id) => document.getElementById(id);
const st = { type: 'A', qs: [], idx: 0, picks: [], ok: 0, locked: false, t0: 0, tick: null };

function show(id) {
  ['menu', 'quiz', 'result'].forEach(s => $(s).classList.toggle('active', s === id));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

function start(type) {
  st.type = type; st.qs = prepare(type); st.idx = 0; st.picks = []; st.ok = 0; st.locked = false; st.t0 = Date.now();
  clearInterval(st.tick);
  st.tick = setInterval(() => { $('timer').textContent = fmt(Math.floor((Date.now() - st.t0) / 1000)); }, 1000);
  $('typePill').textContent = 'Type ' + type;
  $('okCount').textContent = '0';
  $('timer').textContent = '00:00';
  show('quiz');
  render();
}

function render() {
  const q = st.qs[st.idx], n = st.qs.length;
  st.locked = false;
  $('qnum').textContent = `Soal ${st.idx + 1} dari ${n}`;
  $('qtopic').textContent = q.topic;
  $('qtext').innerHTML = q.q;
  $('bar').style.width = (st.idx / n * 100) + '%';
  $('opts').innerHTML = q.opts.map((o, i) =>
    `<button class="opt" data-i="${i}"><span class="badge">${LET[i]}</span><span class="txt">${o}</span><span class="mark"></span></button>`
  ).join('');
  $('opts').querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => choose(+b.dataset.i)));
  $('feedback').classList.remove('show');
  const c = $('qcard'); c.classList.remove('swap'); void c.offsetWidth; c.classList.add('swap');
}

function choose(i) {
  if (st.locked) return;
  st.locked = true;
  const q = st.qs[st.idx];
  st.picks[st.idx] = i;
  const right = i === q.ans;
  if (right) { st.ok++; $('okCount').textContent = st.ok; }
  $('opts').querySelectorAll('.opt').forEach((b, k) => {
    b.disabled = true;
    if (k === q.ans) { b.classList.add('correct'); b.querySelector('.mark').textContent = '✓'; }
    else if (k === i) { b.classList.add('wrong'); b.querySelector('.mark').textContent = '✗'; }
    else b.classList.add('dim');
  });
  const v = $('verdict');
  v.className = 'verdict ' + (right ? 'good' : 'bad');
  v.textContent = right ? 'Benar! Jawabanmu tepat.' : `Belum tepat. Jawaban yang benar adalah ${LET[q.ans]}.`;
  $('steps').innerHTML = q.steps.map(s => `<li>${s}</li>`).join('');
  $('ansLine').innerHTML = `Jawaban: ${LET[q.ans]}. ${q.correct}`;
  $('nextBtn').textContent = st.idx === st.qs.length - 1 ? 'Lihat hasil' : 'Soal berikutnya';
  $('feedback').classList.add('show');
  setTimeout(() => $('feedback').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 120);
}

function next() {
  if (!st.locked) return;
  if (st.idx < st.qs.length - 1) { st.idx++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else finish();
}

function finish() {
  clearInterval(st.tick);
  const n = st.qs.length, secs = Math.floor((Date.now() - st.t0) / 1000);
  const score = Math.round(st.ok / n * 100);
  $('bar').style.width = '100%';
  $('rScore').textContent = score;
  const msg = score >= 90 ? 'Luar biasa, Qisya!' : score >= 75 ? 'Keren banget!' : score >= 60 ? 'Bagus, terus latihan ya!' : 'Semangat, kamu pasti bisa!';
  $('rMsg').textContent = msg;
  $('rSub').textContent = `Type ${st.type}: ${st.ok} benar dari ${n} soal, waktu ${fmt(secs)}.`;
  $('review').innerHTML = '<h3>Pembahasan semua soal</h3>' + st.qs.map((q, i) => {
    const pick = st.picks[i], right = pick === q.ans;
    const plain = q.q.replace(/<[^>]+>/g, '');
    return `<details class="ritem"><summary><span class="n ${right ? 'ok' : 'no'}">${i + 1}</span><span class="sm">${plain}</span></summary>
      <div class="body"><p class="qfull">${q.q}</p>
      <div class="yours">Jawabanmu: <b>${LET[pick]}. ${q.opts[pick]}</b> ${right ? '(benar)' : '(salah)'} &nbsp;|&nbsp; Jawaban benar: <b>${LET[q.ans]}. ${q.correct}</b></div>
      <div class="solution"><h4>Cara mengerjakan</h4><ol class="steps">${q.steps.map(s => `<li>${s}</li>`).join('')}</ol></div></div></details>`;
  }).join('');
  show('result');
  const ring = $('ringFill'); ring.style.strokeDashoffset = 339.3;
  requestAnimationFrame(() => requestAnimationFrame(() => { ring.style.strokeDashoffset = 339.3 * (1 - score / 100); }));
}

/* ============ events ============ */
document.querySelectorAll('.type-btn').forEach(b => b.addEventListener('click', () => start(b.dataset.type)));
$('nextBtn').addEventListener('click', next);
$('againBtn').addEventListener('click', () => start(st.type));
$('menuBtn').addEventListener('click', () => show('menu'));
let exitArmed = null;
$('exitBtn').addEventListener('click', () => {
  const b = $('exitBtn');
  if (exitArmed) { clearTimeout(exitArmed); exitArmed = null; b.textContent = '‹ Menu'; clearInterval(st.tick); show('menu'); return; }
  b.textContent = 'Yakin? Klik lagi';
  exitArmed = setTimeout(() => { exitArmed = null; b.textContent = '‹ Menu'; }, 3000);
});
document.addEventListener('keydown', (e) => {
  if (!$('quiz').classList.contains('active')) return;
  const k = e.key.toLowerCase();
  if (['a', 'b', 'c'].includes(k)) choose(k.charCodeAt(0) - 97);
  else if ((k === 'enter' || k === 'arrowright') && st.locked) next();
});

/* theme toggle (starts in the cream + pink light look) */
$('themeBtn').addEventListener('click', () => {
  const r = document.documentElement, dark = r.getAttribute('data-theme') === 'dark';
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
  $('themeBtn').textContent = dark ? '☾' : '☀';
});

/* ============ decorative sparkles + floating math symbols ============ */
(function deco() {
  const bg = $('bg');
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span');
    s.className = 'spark'; s.textContent = i % 3 ? '✦' : '✧';
    s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
    s.style.fontSize = (10 + Math.random() * 16) + 'px';
    s.style.animationDelay = (Math.random() * 5) + 's'; s.style.animationDuration = (4 + Math.random() * 4) + 's';
    bg.appendChild(s);
  }
  const syms = ['π', '∑', '√', '∞', '÷', '×', '+', '−', '%', 'Δ', '²', '≠'];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('span');
    s.className = 'sym'; s.textContent = syms[i % syms.length];
    s.style.left = (Math.random() * 94) + '%'; s.style.top = (Math.random() * 90) + '%';
    s.style.fontSize = (28 + Math.random() * 46) + 'px';
    s.style.animationDelay = (-Math.random() * 10) + 's'; s.style.animationDuration = (11 + Math.random() * 8) + 's';
    bg.appendChild(s);
  }
})();
</script>
